    <script>
      (function() {
        var hideNetlify = function() {
          var els = document.querySelectorAll(
            '#netlify-drawer, #netlify-badge, [data-netlify-drawer], [data-netlify-badge], iframe[src*="netlify"], .netlify-drawer-container, netlify-drawer, div[id*="netlify-"]'

          for (var i = 0; i < els.length; i++) {
            els[i].style.setProperty('display', 'none', 'important');
            els[i].style.setProperty('visibility', 'hidden', 'important');
            try { els[i].remove(); } catch (e) {}
          }
        };
        hideNetlify();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', hideNetlify);
        }
        window.addEventListener('load', hideNetlify);
        try {
          var obs = new MutationObserver(hideNetlify);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) {}
